name: build
on: [push, pull_request]

jobs:
  # Runs the tests and builds the page on every upload.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: cp -f src/seed.example.js src/seed.js   # the invented demo data
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: paycheck-ledger-demo
          path: dist/paycheck-ledger.html
      # The GitHub Pages site: the built page as index.html, with the document
      # head a browser expects (the Claude artifact host adds this itself).
      - run: |
          mkdir -p site
          { printf '<!doctype html>\n<html lang="en">\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n'
            cat dist/paycheck-ledger.html; } > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishes the site, only after the tests pass on the main branch.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
