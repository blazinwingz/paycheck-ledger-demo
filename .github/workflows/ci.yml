name: build
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: cp -f src/seed.example.js src/seed.js   # the invented demo data
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: paycheck-ledger-demo
          path: dist/paycheck-ledger.html
